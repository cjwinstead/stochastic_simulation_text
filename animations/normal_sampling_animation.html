<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Distribution Sampling Animation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .tile {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #e3f2fd;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .tile-header {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .canvas-container {
            position: relative;
            margin-bottom: 10px;
        }
        
        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        
        .stats {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            margin-top: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .start-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
        }
        
        .stop-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        
        .stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }
        
        .reset-btn {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);
        }
        
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(142, 68, 173, 0.6);
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #34495e;
            font-weight: 600;
        }
        
        input[type="range"] {
            width: 150px;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.3);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Normal Distribution Sampling Animation</h1>
        
        <div class="controls">
            <button id="startBtn" class="start-btn">Start</button>
            <button id="stopBtn" class="stop-btn">Stop</button>
            <button id="resetBtn" class="reset-btn">Reset</button>
            <div class="speed-control">
                <label for="speedSlider">Speed:</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
            </div>
        </div>
        
        <div class="grid">
            <div class="tile">
                <div class="tile-header">Simulation 1</div>
                <div class="canvas-container">
                    <canvas id="canvas1" width="400" height="200"></canvas>
                </div>
                <canvas id="plot1" width="400" height="120"></canvas>
                <div class="stats" id="stats1">Samples: 0 | Mean: 0.00 | True Mean: 0.00</div>
            </div>
            
            <div class="tile">
                <div class="tile-header">Simulation 2</div>
                <div class="canvas-container">
                    <canvas id="canvas2" width="400" height="200"></canvas>
                </div>
                <canvas id="plot2" width="400" height="120"></canvas>
                <div class="stats" id="stats2">Samples: 0 | Mean: 0.00 | True Mean: 0.00</div>
            </div>
            
            <div class="tile">
                <div class="tile-header">Simulation 3</div>
                <div class="canvas-container">
                    <canvas id="canvas3" width="400" height="200"></canvas>
                </div>
                <canvas id="plot3" width="400" height="120"></canvas>
                <div class="stats" id="stats3">Samples: 0 | Mean: 0.00 | True Mean: 0.00</div>
            </div>
            
            <div class="tile">
                <div class="tile-header">Simulation 4</div>
                <div class="canvas-container">
                    <canvas id="canvas4" width="400" height="200"></canvas>
                </div>
                <canvas id="plot4" width="400" height="120"></canvas>
                <div class="stats" id="stats4">Samples: 0 | Mean: 0.00 | True Mean: 0.00</div>
            </div>
        </div>
    </div>

    <script>
        class NormalDistributionSampler {
            constructor(canvasId, plotId, statsId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.plotCanvas = document.getElementById(plotId);
                this.plotCtx = this.plotCanvas.getContext('2d');
                this.statsElement = document.getElementById(statsId);
                
                this.mean = 0;
                this.std = 1;
                this.samples = [];
                this.sampleMeans = [];
                this.currentSample = 0;
                this.maxSamples = 200;
                
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                this.plotWidth = this.plotCanvas.width;
                this.plotHeight = this.plotCanvas.height;
                
                this.initializeDistribution();
                this.drawDistribution();
                this.drawPlot();
                this.updateStats();
            }
            
            initializeDistribution() {
                this.xMin = -4;
                this.xMax = 4;
                this.yMax = 0.5;
                
                this.distributionPoints = [];
                for (let x = this.xMin; x <= this.xMax; x += 0.1) {
                    const y = this.normalPDF(x);
                    this.distributionPoints.push({x, y});
                }
            }
            
            normalPDF(x) {
                return (1 / (this.std * Math.sqrt(2 * Math.PI))) * 
                       Math.exp(-0.5 * Math.pow((x - this.mean) / this.std, 2));
            }
            
            // Box-Muller transform for normal distribution
            generateNormalSample() {
                if (this.spare !== undefined) {
                    const tmp = this.spare;
                    this.spare = undefined;
                    return tmp;
                }
                
                const u = Math.random();
                const v = Math.random();
                const mag = this.std * Math.sqrt(-2 * Math.log(u));
                this.spare = mag * Math.cos(2 * Math.PI * v) + this.mean;
                return mag * Math.sin(2 * Math.PI * v) + this.mean;
            }
            
            xToCanvas(x) {
                return ((x - this.xMin) / (this.xMax - this.xMin)) * this.width;
            }
            
            yToCanvas(y) {
                return this.height - (y / this.yMax) * this.height;
            }
            
            drawDistribution() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // Draw distribution curve
                this.ctx.beginPath();
                this.ctx.strokeStyle = '#3498db';
                this.ctx.lineWidth = 3;
                
                for (let i = 0; i < this.distributionPoints.length; i++) {
                    const point = this.distributionPoints[i];
                    const x = this.xToCanvas(point.x);
                    const y = this.yToCanvas(point.y);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.stroke();
                
                // Fill under curve
                this.ctx.beginPath();
                this.ctx.fillStyle = 'rgba(52, 152, 219, 0.1)';
                this.ctx.moveTo(this.xToCanvas(this.xMin), this.yToCanvas(0));
                for (let i = 0; i < this.distributionPoints.length; i++) {
                    const point = this.distributionPoints[i];
                    const x = this.xToCanvas(point.x);
                    const y = this.yToCanvas(point.y);
                    this.ctx.lineTo(x, y);
                }
                this.ctx.lineTo(this.xToCanvas(this.xMax), this.yToCanvas(0));
                this.ctx.fill();
                
                // Draw sample points
                this.ctx.fillStyle = '#e74c3c';
                for (let i = 0; i < this.samples.length; i++) {
                    const sample = this.samples[i];
                    const x = this.xToCanvas(sample);
                    const y = this.yToCanvas(0);
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y - 5, 4, 0, 2 * Math.PI);
                    this.ctx.fill();
                    
                    // Draw vertical line to show sample
                    this.ctx.beginPath();
                    this.ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
                    this.ctx.lineWidth = 2;
                    this.ctx.moveTo(x, y - 5);
                    this.ctx.lineTo(x, y - 30);
                    this.ctx.stroke();
                }
                
                // Draw true mean line
                const trueMeanX = this.xToCanvas(this.mean);
                this.ctx.beginPath();
                this.ctx.strokeStyle = '#27ae60';
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([5, 5]);
                this.ctx.moveTo(trueMeanX, 0);
                this.ctx.lineTo(trueMeanX, this.height);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
                
                // Draw current sample mean line
                if (this.samples.length > 0) {
                    const currentMean = this.samples.reduce((a, b) => a + b, 0) / this.samples.length;
                    const currentMeanX = this.xToCanvas(currentMean);
                    this.ctx.beginPath();
                    this.ctx.strokeStyle = '#f39c12';
                    this.ctx.lineWidth = 3;
                    this.ctx.setLineDash([10, 5]);
                    this.ctx.moveTo(currentMeanX, 0);
                    this.ctx.lineTo(currentMeanX, this.height);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }
                
                // Draw axes
                this.ctx.strokeStyle = '#34495e';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.yToCanvas(0));
                this.ctx.lineTo(this.width, this.yToCanvas(0));
                this.ctx.stroke();
                
                // Draw axis labels
                this.ctx.fillStyle = '#34495e';
                this.ctx.font = '12px Arial';
                this.ctx.textAlign = 'center';
                for (let x = -4; x <= 4; x += 2) {
                    const canvasX = this.xToCanvas(x);
                    this.ctx.fillText(x.toString(), canvasX, this.height - 5);
                }
            }
            
            drawPlot() {
                this.plotCtx.clearRect(0, 0, this.plotWidth, this.plotHeight);
                
                if (this.sampleMeans.length === 0) return;
                
                // Draw background grid
                this.plotCtx.strokeStyle = '#ecf0f1';
                this.plotCtx.lineWidth = 1;
                
                // Vertical grid lines
                for (let i = 0; i <= 10; i++) {
                    const x = (i / 10) * this.plotWidth;
                    this.plotCtx.beginPath();
                    this.plotCtx.moveTo(x, 0);
                    this.plotCtx.lineTo(x, this.plotHeight);
                    this.plotCtx.stroke();
                }
                
                // Horizontal grid lines
                for (let i = 0; i <= 5; i++) {
                    const y = (i / 5) * this.plotHeight;
                    this.plotCtx.beginPath();
                    this.plotCtx.moveTo(0, y);
                    this.plotCtx.lineTo(this.plotWidth, y);
                    this.plotCtx.stroke();
                }
                
                // Find y-axis range
                const allMeans = this.sampleMeans;
                const minMean = Math.min(...allMeans, this.mean - 0.5);
                const maxMean = Math.max(...allMeans, this.mean + 0.5);
                const yRange = maxMean - minMean;
                const yPadding = yRange * 0.1;
                const yMin = minMean - yPadding;
                const yMax = maxMean + yPadding;
                
                // Draw true mean line
                const trueMeanY = this.plotHeight - ((this.mean - yMin) / (yMax - yMin)) * this.plotHeight;
                this.plotCtx.beginPath();
                this.plotCtx.strokeStyle = '#27ae60';
                this.plotCtx.lineWidth = 2;
                this.plotCtx.setLineDash([5, 5]);
                this.plotCtx.moveTo(0, trueMeanY);
                this.plotCtx.lineTo(this.plotWidth, trueMeanY);
                this.plotCtx.stroke();
                this.plotCtx.setLineDash([]);
                
                // Draw sample means line
                this.plotCtx.beginPath();
                this.plotCtx.strokeStyle = '#f39c12';
                this.plotCtx.lineWidth = 3;
                
                for (let i = 0; i < this.sampleMeans.length; i++) {
                    const x = (i / Math.max(this.sampleMeans.length - 1, 1)) * this.plotWidth;
                    const y = this.plotHeight - ((this.sampleMeans[i] - yMin) / (yMax - yMin)) * this.plotHeight;
                    
                    if (i === 0) {
                        this.plotCtx.moveTo(x, y);
                    } else {
                        this.plotCtx.lineTo(x, y);
                    }
                }
                this.plotCtx.stroke();
                
                // Draw points
                this.plotCtx.fillStyle = '#f39c12';
                for (let i = 0; i < this.sampleMeans.length; i++) {
                    const x = (i / Math.max(this.sampleMeans.length - 1, 1)) * this.plotWidth;
                    const y = this.plotHeight - ((this.sampleMeans[i] - yMin) / (yMax - yMin)) * this.plotHeight;
                    
                    this.plotCtx.beginPath();
                    this.plotCtx.arc(x, y, 3, 0, 2 * Math.PI);
                    this.plotCtx.fill();
                }
                
                // Draw axes
                this.plotCtx.strokeStyle = '#34495e';
                this.plotCtx.lineWidth = 1;
                this.plotCtx.beginPath();
                this.plotCtx.moveTo(0, this.plotHeight);
                this.plotCtx.lineTo(this.plotWidth, this.plotHeight);
                this.plotCtx.moveTo(0, 0);
                this.plotCtx.lineTo(0, this.plotHeight);
                this.plotCtx.stroke();
                
                // Draw labels
                this.plotCtx.fillStyle = '#34495e';
                this.plotCtx.font = '11px Arial';
                this.plotCtx.textAlign = 'center';
                this.plotCtx.fillText('Sample Number', this.plotWidth / 2, this.plotHeight - 3);
                
                this.plotCtx.save();
                this.plotCtx.translate(15, this.plotHeight / 2);
                this.plotCtx.rotate(-Math.PI / 2);
                this.plotCtx.fillText('Sample Mean', 0, 0);
                this.plotCtx.restore();
            }
            
            updateStats() {
                const currentMean = this.samples.length > 0 ? 
                    this.samples.reduce((a, b) => a + b, 0) / this.samples.length : 0;
                
                this.statsElement.textContent = 
                    `Samples: ${this.samples.length} | Mean: ${currentMean.toFixed(3)} | True Mean: ${this.mean.toFixed(2)}`;
            }
            
            addSample() {
                if (this.samples.length < this.maxSamples) {
                    const sample = this.generateNormalSample();
                    this.samples.push(sample);
                    
                    const currentMean = this.samples.reduce((a, b) => a + b, 0) / this.samples.length;
                    this.sampleMeans.push(currentMean);
                    
                    this.drawDistribution();
                    this.drawPlot();
                    this.updateStats();
                }
            }
            
            reset() {
                this.samples = [];
                this.sampleMeans = [];
                this.currentSample = 0;
                this.spare = undefined;
                this.drawDistribution();
                this.drawPlot();
                this.updateStats();
            }
        }
        
        // Initialize samplers
        const samplers = [
            new NormalDistributionSampler('canvas1', 'plot1', 'stats1'),
            new NormalDistributionSampler('canvas2', 'plot2', 'stats2'),
            new NormalDistributionSampler('canvas3', 'plot3', 'stats3'),
            new NormalDistributionSampler('canvas4', 'plot4', 'stats4')
        ];
        
        let animationId;
        let isRunning = false;
        let speed = 5;
        
        function animate() {
            if (!isRunning) return;
            
            samplers.forEach(sampler => sampler.addSample());
            
            setTimeout(() => {
                animationId = requestAnimationFrame(animate);
            }, 1000 / speed);
        }
        
        document.getElementById('startBtn').addEventListener('click', () => {
            isRunning = true;
            animate();
        });
        
        document.getElementById('stopBtn').addEventListener('click', () => {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            samplers.forEach(sampler => sampler.reset());
        });
        
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
        });
    </script>
</body>
</html>
