<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Distribution Sampling Animation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 300;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        canvas {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .sample-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        .sample-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        .auto-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        
        .auto-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }
        
        .auto-btn.active {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        
        .reset-btn {
            background: linear-gradient(45deg, #757575, #616161);
            color: white;
            box-shadow: 0 4px 15px rgba(117, 117, 117, 0.3);
        }
        
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(117, 117, 117, 0.4);
        }
        
        .stats {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid #dee2e6;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .recent-samples {
            margin-top: 20px;
        }
        
        .recent-samples h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .sample-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .sample-item {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .sample-item.newest {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .sample-item.older {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Normal Distribution Sampling</h1>
        
        <div class="canvas-container">
            <canvas id="distributionCanvas" width="800" height="400"></canvas>
        </div>
        
        <div class="controls">
            <button class="sample-btn" onclick="takeSample()">Take Sample</button>
            <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">Start Auto</button>
            <button class="reset-btn" onclick="reset()">Reset</button>
        </div>
        
        <div class="stats">
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">Sample Mean</div>
                    <div class="stat-value" id="sampleMean">0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Samples</div>
                    <div class="stat-value" id="totalSamples">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Population Mean</div>
                    <div class="stat-value">0.00</div>
                </div>
            </div>
            
            <div class="recent-samples">
                <h3>Most Recent 5 Samples</h3>
                <div class="sample-list" id="recentSamples">
                    <div class="sample-item older">No samples yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('distributionCanvas');
        const ctx = canvas.getContext('2d');
        
        // Animation state
        let samples = [];
        let recentSamples = [];
        let autoInterval = null;
        let animationFrame = null;
        
        // Distribution parameters
        const mean = 0;
        const stdDev = 1;
        const xMin = -4;
        const xMax = 4;
        const yMax = 0.5;
        
        // Canvas dimensions
        const padding = 60;
        const plotWidth = canvas.width - 2 * padding;
        const plotHeight = canvas.height - 2 * padding;
        
        // Convert data coordinates to canvas coordinates
        function dataToCanvas(x, y) {
            const canvasX = padding + ((x - xMin) / (xMax - xMin)) * plotWidth;
            const canvasY = canvas.height - padding - (y / yMax) * plotHeight;
            return { x: canvasX, y: canvasY };
        }
        
        // Normal distribution PDF
        function normalPDF(x, mu, sigma) {
            return (1 / (sigma * Math.sqrt(2 * Math.PI))) * 
                   Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2));
        }
        
        // Generate random normal sample using Box-Muller transform
        function generateNormalSample() {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            return z0 * stdDev + mean;
        }
        
        // Draw the normal distribution curve
        function drawDistribution() {
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let x = xMin; x <= xMax; x += 0.01) {
                const y = normalPDF(x, mean, stdDev);
                const point = dataToCanvas(x, y);
                
                if (x === xMin) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            }
            ctx.stroke();
        }
        
        // Draw axes and labels
        function drawAxes() {
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            
            // X-axis
            const xAxis = dataToCanvas(0, 0);
            ctx.beginPath();
            ctx.moveTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();
            
            // Y-axis
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.stroke();
            
            // X-axis labels
            ctx.fillStyle = '#666';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            for (let x = -4; x <= 4; x += 1) {
                const point = dataToCanvas(x, 0);
                ctx.fillText(x.toString(), point.x, canvas.height - padding + 20);
            }
            
            // Y-axis labels
            ctx.textAlign = 'right';
            for (let y = 0; y <= 0.4; y += 0.1) {
                const point = dataToCanvas(0, y);
                ctx.fillText(y.toFixed(1), padding - 10, point.y + 4);
            }
        }
        
        // Draw sample points
        function drawSamples() {
            // Draw all samples as small dots
	    
            ctx.fillStyle = 'rgba(52, 152, 219, 0.6)';
	    if (samples.length<100) {
            samples.forEach(sample => {
                const point = dataToCanvas(sample, 0);
                ctx.beginPath();
                ctx.arc(point.x, point.y - 10, 3, 0, 2 * Math.PI);
                ctx.fill();
            });
	    }
            // Highlight recent samples
            recentSamples.forEach((sample, index) => {
                const point = dataToCanvas(sample, 0);
                const isNewest = index === recentSamples.length - 1;
                
                if (isNewest) {
                    // Newest sample - large red dot with animation
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(point.x, point.y - 10, 8, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    // Add pulsing ring
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y - 10, 12, 0, 2 * Math.PI);
                    ctx.stroke();
                } else {
                    // Other recent samples - medium blue dots
                    ctx.fillStyle = '#3498db';
                    ctx.beginPath();
                    ctx.arc(point.x, point.y - 10, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }
        
        // Draw everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Fill background
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawAxes();
            drawDistribution();
            drawSamples();
        }
        
        // Update statistics display
        function updateStats() {
            const mean = samples.length > 0 ? 
                samples.reduce((sum, s) => sum + s, 0) / samples.length : 0;
            
            document.getElementById('sampleMean').textContent = mean.toFixed(3);
            document.getElementById('totalSamples').textContent = samples.length;
            
            // Update recent samples display
            const recentContainer = document.getElementById('recentSamples');
            if (recentSamples.length === 0) {
                recentContainer.innerHTML = '<div class="sample-item older">No samples yet</div>';
            } else {
                recentContainer.innerHTML = recentSamples.map((sample, index) => {
                    const isNewest = index === recentSamples.length - 1;
                    const className = isNewest ? 'newest' : 'older';
                    return `<div class="sample-item ${className}">${sample.toFixed(2)}</div>`;
                }).join('');
            }
        }
        
        // Take a sample
        function takeSample() {
            const sample = generateNormalSample();
            samples.push(sample);
            
            // Update recent samples (keep only last 5)
            recentSamples.push(sample);
            if (recentSamples.length > 5) {
                recentSamples.shift();
            }
            
            updateStats();
            draw();
        }
        
        // Toggle auto sampling
        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                btn.textContent = 'Start Auto';
                btn.classList.remove('active');
            } else {
                autoInterval = setInterval(takeSample, 50);
                btn.textContent = 'Stop Auto';
                btn.classList.add('active');
            }
        }
        
        // Reset everything
        function reset() {
            samples = [];
            recentSamples = [];
            
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                document.getElementById('autoBtn').textContent = 'Start Auto';
                document.getElementById('autoBtn').classList.remove('active');
            }
            
            updateStats();
            draw();
        }
        
        // Initialize
        draw();
        updateStats();
    </script>
</body>
</html>
